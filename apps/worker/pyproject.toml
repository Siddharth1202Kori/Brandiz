[project]
name = "seomaster-worker"
version = "0.1.0"
description = "SeoMaster Celery workers + Beat"
requires-python = ">=3.12,<3.13"
dependencies = [
    "seomaster-core",
    "seomaster-db",
    "seomaster-providers",
    "celery[redis]>=5.4",
    "sentry-sdk>=2.18",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-celery>=0.49b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seomaster_worker"]

[tool.uv.sources]
seomaster-core = { workspace = true }
seomaster-db = { workspace = true }
seomaster-providers = { workspace = true }

[tool.hatch.build]
dev-mode-dirs = ["src"]
