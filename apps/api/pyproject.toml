[project]
name = "seomaster-api"
version = "0.1.0"
description = "SeoMaster FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "seomaster-core",
    "seomaster-db",
    "seomaster-providers",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "sentry-sdk[fastapi]>=2.18",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seomaster_api"]

[tool.uv.sources]
seomaster-core = { workspace = true }
seomaster-db = { workspace = true }
seomaster-providers = { workspace = true }

[tool.hatch.build]
dev-mode-dirs = ["src"]
