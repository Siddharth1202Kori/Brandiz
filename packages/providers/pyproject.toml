[project]
name = "seomaster-providers"
version = "0.1.0"
description = "Provider interfaces, adapters and the Data Access Layer (cache, single-flight, budget, ledger)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "seomaster-core",
    "redis>=5.2",
    "clickhouse-connect[async]>=0.8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seomaster_providers"]

[tool.uv.sources]
seomaster-core = { workspace = true }

[tool.hatch.build]
dev-mode-dirs = ["src"]
