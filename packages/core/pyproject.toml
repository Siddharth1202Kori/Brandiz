[project]
name = "seomaster-core"
version = "0.1.0"
description = "Shared models, settings, markets and normalizers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seomaster_core"]

[tool.hatch.build]
dev-mode-dirs = ["src"]
